spring.application.name=eldercare-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:${user.home}/eldercare360;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=QWxsQ29kZSBTZWF0aGVzIHJlYWxseSBzdW1tYXJpemUgdG9vbA==
app.jwt.expiration-ms=86400000

storage.location=${user.home}/eldercare-files
ocr.service.url=http://localhost:8001
